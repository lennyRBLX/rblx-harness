[package]
name = "rblx-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "rblx_harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
fancy-regex = "0.16"
filetime = "0.2"
flate2 = "1"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
libc = "0.2"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
